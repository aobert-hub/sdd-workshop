<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop checkout</title>
</head>
<body>
  <h1>Shop checkout</h1>
  <form id="add-form">
    <label>Price (EUR) <input id="price" type="number" step="0.01" min="0"></label>
    <label>Sticker (%) <input id="sticker" type="number" step="1" min="0" max="100"></label>
    <button type="submit">Add product</button>
  </form>
  <p>Basket total: <span id="total">0.00</span> EUR</p>
  <script src="checkout.js"></script>
  <script>
    var basket = newBasket();
    document.getElementById("add-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var input = document.getElementById("price");
      if (input.value === "") { return; }
      var sticker = document.getElementById("sticker");
      basket.add(Number(input.value), sticker.value === "" ? 0 : Number(sticker.value));
      document.getElementById("total").textContent = basket.total();
      input.value = "";
      sticker.value = "";
    });
  </script>
</body>
</html>
